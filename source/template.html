<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數位大腦解剖檯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   數位大腦解剖檯 — 台師大 115-1 腦與學習
   配色取自組織染色：尼氏紫（灰質）／髓鞘藍（白質）／標本骨色
   ============================================================ */

:root{
  /* 淺色＝圖譜印刷版 */
  --ground:#efe9dd;
  --stage:#f7f3ea;
  --panel:#fcfaf5;
  --rail:#e5ddcd;
  --ink:#1b1f26;
  --ink2:#4d5563;
  --ink3:#5a626f;
  --rule:#d5cbb7;
  --rule-soft:#e2dacb;
  --brass:#7a5510;
  --brass-lit:#b98d2e;
  --focus:#7a5510;

  /* 染色盤 */
  --grey-matter:#8a5aa6;
  --white-matter:#4c7cb2;
  --bone:#c3ac81;
  --marrow:#b08f6a;
  --dura:#7e8290;
  --arachnoid:#93a6b0;
  --subarach:#bcd3d8;
  --pia:#c07f80;
  --scalp:#b1826a;
  --csf:#1a8f96;
  --csf-fill:#bde4e4;
  --vessel:#ac2f2b;
  --thalamus:#9c4368;
  --striatum:#7a55a4;
  --pallidum:#5f6f9a;
  --amygdala:#bd6330;
  --hippocampus:#37855f;
  --brainstem:#96795a;
  --cerebellum:#7b6ba8;

  /* 腦葉 */
  --lobe-frontal:#b8672f;
  --lobe-parietal:#3f7f9c;
  --lobe-temporal:#8a5aa6;
  --lobe-occipital:#37855f;
  --lobe-insula:#9c4368;
  --lobe-cerebellum:#6f6296;

  --shadow:0 18px 46px rgba(60,45,20,.13);
  --shadow-soft:0 2px 10px rgba(60,45,20,.08);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0c0f14;
    --stage:#121620;
    --panel:#171c27;
    --rail:#0f131b;
    --ink:#e6ecf5;
    --ink2:#a3aec0;
    --ink3:#8b96a8;
    --rule:#28303f;
    --rule-soft:#1e2532;
    --brass:#d8ae5c;
    --brass-lit:#f0cd85;
    --focus:#d8ae5c;

    --grey-matter:#b587cf;
    --white-matter:#79aee4;
    --bone:#d6bd91;
    --marrow:#a78256;
    --dura:#a8adbd;
    --arachnoid:#9fb6c2;
    --subarach:#2b4650;
    --pia:#dd9a9b;
    --scalp:#c99578;
    --csf:#4fd3d3;
    --csf-fill:#123c40;
    --vessel:#e05a52;
    --thalamus:#d76a92;
    --striatum:#a882dd;
    --pallidum:#8b9cd0;
    --amygdala:#e58b4d;
    --hippocampus:#4fc48a;
    --brainstem:#c4a377;
    --cerebellum:#a695de;

    --lobe-frontal:#e08b4a;
    --lobe-parietal:#5aa8ca;
    --lobe-temporal:#b587cf;
    --lobe-occipital:#4fc48a;
    --lobe-insula:#d76a92;
    --lobe-cerebellum:#9a8ad0;

    --shadow:0 22px 60px rgba(0,0,0,.6);
    --shadow-soft:0 2px 12px rgba(0,0,0,.4);
  }
}

:root[data-theme="dark"]{
  --ground:#0c0f14;
  --stage:#121620;
  --panel:#171c27;
  --rail:#0f131b;
  --ink:#e6ecf5;
  --ink2:#a3aec0;
  --ink3:#8b96a8;
  --rule:#28303f;
  --rule-soft:#1e2532;
  --brass:#d8ae5c;
  --brass-lit:#f0cd85;
  --focus:#d8ae5c;

  --grey-matter:#b587cf;
  --white-matter:#79aee4;
  --bone:#d6bd91;
  --marrow:#a78256;
  --dura:#a8adbd;
  --arachnoid:#9fb6c2;
  --subarach:#2b4650;
  --pia:#dd9a9b;
  --scalp:#c99578;
  --csf:#4fd3d3;
  --csf-fill:#123c40;
  --vessel:#e05a52;
  --thalamus:#d76a92;
  --striatum:#a882dd;
  --pallidum:#8b9cd0;
  --amygdala:#e58b4d;
  --hippocampus:#4fc48a;
  --brainstem:#c4a377;
  --cerebellum:#a695de;

  --lobe-frontal:#e08b4a;
  --lobe-parietal:#5aa8ca;
  --lobe-temporal:#b587cf;
  --lobe-occipital:#4fc48a;
  --lobe-insula:#d76a92;
  --lobe-cerebellum:#9a8ad0;

  --shadow:0 22px 60px rgba(0,0,0,.6);
  --shadow-soft:0 2px 12px rgba(0,0,0,.4);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

.la{
  font-family:"EB Garamond",Georgia,"Times New Roman",serif;
  font-style:italic;
  font-size:1.06em;
  letter-spacing:.01em;
}
.mono{
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums;
}

/* ---------- 版面 ---------- */
.shell{
  display:grid;
  grid-template-columns:190px minmax(0,1fr) 336px;
  grid-template-rows:auto 1fr;
  gap:0;
  min-height:100vh;
  max-width:1560px;
  margin:0 auto;
}

/* ---------- 抬頭 ---------- */
.masthead{
  grid-column:1 / -1;
  display:flex;
  align-items:baseline;
  gap:18px;
  flex-wrap:wrap;
  padding:20px 26px 16px;
  border-bottom:1px solid var(--rule);
  background:var(--rail);
}
.masthead h1{
  font-family:"Noto Serif TC",serif;
  font-weight:700;
  font-size:23px;
  letter-spacing:.06em;
  margin:0;
  line-height:1.2;
}
.masthead .sub{
  font-size:12.5px;
  color:var(--ink3);
  letter-spacing:.08em;
}
.masthead .spacer{flex:1 1 auto}

.tool-btn{
  font:inherit;
  font-size:12.5px;
  letter-spacing:.06em;
  color:var(--ink2);
  background:transparent;
  border:1px solid var(--rule);
  border-radius:2px;
  padding:5px 11px;
  cursor:pointer;
  transition:border-color .18s,color .18s,background .18s;
}
.tool-btn:hover{border-color:var(--brass);color:var(--brass)}
.tool-btn[aria-pressed="true"]{
  background:var(--brass);
  border-color:var(--brass);
  color:var(--rail);
  font-weight:500;
}
:where(button,input,[tabindex]):focus-visible{
  outline:2px solid var(--focus);
  outline-offset:2px;
}

/* ---------- 左側檯位 ---------- */
.rail{
  background:var(--rail);
  border-right:1px solid var(--rule);
  padding:22px 0 30px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.rail .rail-cap{
  font-size:10.5px;
  letter-spacing:.22em;
  color:var(--ink3);
  padding:0 20px 12px;
  text-transform:uppercase;
}
.station-btn{
  display:block;
  width:100%;
  text-align:left;
  font:inherit;
  background:transparent;
  border:0;
  border-left:2px solid transparent;
  padding:11px 20px 11px 18px;
  cursor:pointer;
  color:var(--ink2);
  transition:color .18s,border-color .18s,background .18s;
}
.station-btn .n{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  color:var(--ink3);
  display:block;
  letter-spacing:.1em;
}
.station-btn .t{
  font-family:"Noto Serif TC",serif;
  font-weight:600;
  font-size:15.5px;
  letter-spacing:.04em;
  display:block;
}
.station-btn .d{
  font-size:11.5px;
  color:var(--ink3);
  line-height:1.5;
  display:block;
  margin-top:2px;
}
.station-btn:hover{color:var(--ink);background:var(--rule-soft)}
.station-btn[aria-pressed="true"]{
  border-left-color:var(--brass);
  color:var(--ink);
  background:var(--rule-soft);
}
.station-btn[aria-pressed="true"] .n{color:var(--brass)}

.rail-foot{
  margin-top:auto;
  padding:18px 20px 0;
  border-top:1px solid var(--rule);
  font-size:11.5px;
  color:var(--ink3);
  line-height:1.6;
}

/* ---------- 中央標本檯 ---------- */
.stage-wrap{
  background:var(--stage);
  padding:22px 26px 26px;
  display:flex;
  flex-direction:column;
  gap:16px;
  min-width:0;
}
.stage-head{
  display:flex;
  align-items:flex-end;
  gap:14px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--rule-soft);
  padding-bottom:12px;
}
.stage-head h2{
  font-family:"Noto Serif TC",serif;
  font-weight:600;
  font-size:19px;
  margin:0;
  letter-spacing:.05em;
}
.stage-head .plane{
  font-size:11.5px;
  color:var(--ink3);
  letter-spacing:.1em;
}
.stage-head .hint{
  margin-left:auto;
  font-size:12px;
  color:var(--ink3);
}

.canvas{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.canvas svg{
  width:100%;
  height:auto;
  max-height:min(64vh,620px);
  display:block;
  overflow:visible;
}
.view{display:none}
.view.on{display:block}

/* ---------- 控制條 ---------- */
.controls{
  border-top:1px solid var(--rule-soft);
  padding-top:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.ctl-row{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.ctl-label{
  font-size:11px;
  letter-spacing:.16em;
  color:var(--ink3);
  min-width:66px;
}
input[type=range]{
  flex:1 1 220px;
  min-width:170px;
  accent-color:var(--brass);
  height:22px;
  cursor:pointer;
}
.step-read{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  color:var(--brass);
  min-width:150px;
}
.seg{
  display:flex;
  gap:0;
  border:1px solid var(--rule);
  border-radius:2px;
  overflow:hidden;
}
.seg button{
  font:inherit;
  font-size:12.5px;
  background:transparent;
  border:0;
  border-right:1px solid var(--rule);
  padding:6px 12px;
  cursor:pointer;
  color:var(--ink2);
  transition:background .16s,color .16s;
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--rule-soft);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--rail);font-weight:500}

/* ---------- 右側標本籤 ---------- */
.tag-col{
  background:var(--rail);
  border-left:1px solid var(--rule);
  padding:22px 20px 28px;
  display:flex;
  flex-direction:column;
  gap:16px;
  min-width:0;
  overflow-y:auto;
  max-height:100vh;
}
.tag{
  background:var(--panel);
  border:1px solid var(--rule);
  border-radius:2px;
  box-shadow:var(--shadow-soft);
  padding:16px 17px 17px;
  position:relative;
}
.tag::before{
  content:"";
  position:absolute;
  left:0; top:0; bottom:0;
  width:3px;
  background:var(--swatch,var(--brass));
}
.tag .kicker{
  font-size:10.5px;
  letter-spacing:.2em;
  color:var(--ink3);
  text-transform:uppercase;
  margin-bottom:6px;
}
.tag h3{
  font-family:"Noto Serif TC",serif;
  font-weight:700;
  font-size:19px;
  margin:0 0 2px;
  letter-spacing:.03em;
  text-wrap:balance;
}
.tag .latin{
  color:var(--ink2);
  font-size:14px;
  margin-bottom:12px;
  display:block;
}
.tag dl{margin:0;display:flex;flex-direction:column;gap:10px}
.tag dt{
  font-size:10.5px;
  letter-spacing:.18em;
  color:var(--ink3);
  margin-bottom:2px;
}
.tag dd{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink)}
.tag dd em{font-style:normal;color:var(--brass);font-weight:500}

.course-link{
  border-top:1px dashed var(--rule);
  margin-top:13px;
  padding-top:11px;
  font-size:12.5px;
  color:var(--ink2);
  line-height:1.6;
}
.course-link b{
  color:var(--brass);
  font-weight:500;
  font-family:"Noto Serif TC",serif;
}

.legend{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.legend .lg-cap{
  font-size:10.5px;
  letter-spacing:.2em;
  color:var(--ink3);
  margin-bottom:3px;
}
.legend button{
  display:flex;
  align-items:center;
  gap:9px;
  width:100%;
  font:inherit;
  font-size:12.5px;
  background:transparent;
  border:0;
  border-radius:2px;
  padding:4px 6px;
  cursor:pointer;
  color:var(--ink2);
  text-align:left;
  transition:background .15s,color .15s;
}
.legend button:hover{background:var(--rule-soft);color:var(--ink)}
.legend button[aria-current="true"]{background:var(--rule-soft);color:var(--ink);font-weight:500}
.legend .sw{
  width:11px;height:11px;
  flex:0 0 11px;
  border-radius:1px;
  background:var(--c);
  border:1px solid rgba(128,128,128,.35);
}
.legend .idx{
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  color:var(--ink3);
  margin-left:auto;
}

/* ---------- 導覽字幕 ---------- */
.tour{
  display:none;
  gap:12px;
  align-items:flex-start;
  background:var(--panel);
  border:1px solid var(--brass);
  border-radius:2px;
  padding:13px 15px;
  box-shadow:var(--shadow-soft);
}
.tour.on{display:flex}
.tour .step-n{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  color:var(--brass);
  padding-top:3px;
  flex:0 0 auto;
}
.tour p{margin:0;font-size:13.5px;line-height:1.7;flex:1 1 auto}
.tour .tour-btns{display:flex;gap:6px;flex:0 0 auto;align-self:center}

/* ---------- SVG 通用 ---------- */
svg text{font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif}
.hit{cursor:pointer}
.struct{transition:opacity .5s ease,filter .3s ease}
.struct.dim{opacity:.16}
.struct.lit{filter:drop-shadow(0 0 7px var(--brass-lit))}
.outline{fill:none;stroke:var(--ink3);stroke-width:1.1;opacity:.5}
.lbl{font-size:11.5px;fill:var(--ink);font-weight:500}
.lbl-la{font-size:10px;fill:var(--ink3);font-family:"EB Garamond",serif;font-style:italic}
.leader{stroke:var(--ink3);stroke-width:.8;fill:none;opacity:.65}
.cut-line{stroke:var(--brass);stroke-width:1;stroke-dasharray:5 5;opacity:.75}
.cap-note{font-size:10.5px;fill:var(--ink3);letter-spacing:.12em}

/* 剝離狀態 */
.peeled{fill-opacity:.05!important;stroke-opacity:.4;stroke-dasharray:3 3}
.layer-g{transition:opacity .45s ease,fill-opacity .45s ease}
.layer-g.current{filter:drop-shadow(0 0 9px var(--brass-lit))}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
}

/* ---------- 窄螢幕 ---------- */
@media (max-width:1180px){
  .shell{grid-template-columns:160px minmax(0,1fr) 300px}
}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .rail{
    flex-direction:row;
    overflow-x:auto;
    border-right:0;
    border-bottom:1px solid var(--rule);
    padding:12px;
    gap:6px;
  }
  .rail .rail-cap,.rail-foot{display:none}
  .station-btn{
    width:auto;
    white-space:nowrap;
    border-left:0;
    border-bottom:2px solid transparent;
    padding:8px 14px;
  }
  .station-btn[aria-pressed="true"]{border-left:0;border-bottom-color:var(--brass)}
  .station-btn .d{display:none}
  .tag-col{border-left:0;border-top:1px solid var(--rule);max-height:none}
  .canvas svg{max-height:none}
  /* 窄螢幕下 .shell 的 1fr 落在 rail，main 變成依內容高，
     .canvas 的 flex:1 1 auto 沒有剩餘空間可分配就會收成 0。
     只有三維檯位需要撐高；組織學是 SVG，讓它照自己的比例走。 */
  .canvas.is3d{min-height:min(70vh,520px)}
}
</style>
</head>
<body>

<div class="shell">

  <header class="masthead">
    <h1>數位大腦解剖檯</h1>
    <span class="sub mono">115-1 腦與學習 ／ 台師大</span>
    <span class="spacer"></span>
    <button class="tool-btn" id="labelToggle" aria-pressed="false">顯示全部標註</button>
    <button class="tool-btn" id="tourToggle" aria-pressed="false">自動導覽</button>
    <button class="tool-btn" id="themeToggle">切換明暗</button>
  </header>

  <nav class="rail" aria-label="解剖檯位">
    <div class="rail-cap">檯位</div>
    <button class="station-btn" data-station="peel" aria-pressed="true">
      <span class="n">01</span><span class="t">逐層剝離</span>
      <span class="d">頭皮到腦室，九層</span>
    </button>
    <button class="station-btn" data-station="slice" aria-pressed="false">
      <span class="n">02</span><span class="t">切面掃描</span>
      <span class="d">六刀冠狀切，前到後</span>
    </button>
    <button class="station-btn" data-station="histo" aria-pressed="false">
      <span class="n">03</span><span class="t">皮質組織學</span>
      <span class="d">六層與柱狀迴路</span>
    </button>
    <button class="station-btn" data-station="network" aria-pressed="false">
      <span class="n">04</span><span class="t">分區與網絡</span>
      <span class="d">腦葉、DMN、查核守衛</span>
    </button>
    <button class="station-btn" data-station="flow" aria-pressed="false">
      <span class="n">05</span><span class="t">運作流程</span>
      <span class="d">刺激到行動，毫秒時間軸</span>
    </button>
    <div class="rail-foot">
      點畫面上任何一個構造，右邊會出現它的標本籤。<br>
      鍵盤：<span class="mono">← →</span> 換層或換刀。
    </div>
  </nav>

  <main class="stage-wrap">
    <div class="stage-head">
      <h2 id="stageTitle">逐層剝離</h2>
      <span class="plane mono" id="stagePlane">冠狀切面 · 視丘層 y ≈ −8 mm</span>
      <span class="hint" id="stageHint">左半邊剝離，右半邊保持完整，可以對照</span>
    </div>

    <div class="tour" id="tourBar">
      <span class="step-n" id="tourStep">01 / 14</span>
      <p id="tourText">導覽準備中。</p>
      <span class="tour-btns">
        <button class="tool-btn" id="tourPrev">上一步</button>
        <button class="tool-btn" id="tourNext">下一步</button>
      </span>
    </div>

    <div class="canvas" id="canvas"><!-- 各檯位 SVG 由此插入 --></div>
    <!-- flowLabels 由 build.py 插進 canvas 內 -->

    <div class="controls" id="controls"><!-- 各檯位控制項由此插入 --></div>
  </main>

  <aside class="tag-col">
    <div class="tag" id="tagCard">
      <div class="kicker">標本籤</div>
      <h3 id="tagName">尚未選取</h3>
      <span class="latin la" id="tagLatin">點畫面上的構造</span>
      <dl id="tagBody"></dl>
      <div class="course-link" id="tagCourse" hidden></div>
    </div>
    <div class="legend" id="legend"></div>
  </aside>

</div>

<script>
"use strict";
/* 資料與互動邏輯見下方分段 */
</script>
</body>
</html>
