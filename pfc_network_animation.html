/* ---------- shared 22s timeline ---------- */
.pulse,.halo,.ringLit,.cap,.supX,.bar{
  animation-duration:22s; animation-iteration-count:infinite; animation-timing-function:linear;
}
.wire{fill:none;stroke:#24314e;stroke-width:1.6}
.pulse{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:11 100;stroke-dashoffset:0;opacity:0}
.ring{fill:#0e1526;stroke:#2b3c5e;stroke-width:1.4}
.ringLit{fill:none;stroke-width:2.4;opacity:.12}
.halo{opacity:.1}
.nlab{fill:#cddcf5;font-size:15px;font-weight:650;text-anchor:middle}
.nsub{fill:#7488ab;font-size:10.5px;text-anchor:middle;letter-spacing:.3px}
.elab{fill:#61759b;font-size:10px}
.ghost{fill:none;stroke:#3d4a68;stroke-width:1.3;stroke-dasharray:3 5;opacity:.6}
.cap{fill:#dbe6fa;font-size:14.5px;opacity:0}
.capnum{fill:#5ea8ff;font-size:11.5px;font-weight:700}
